services:
  - type: web
    name: localai-sidekick
    runtime: python
    region: oregon
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.x
      - key: DEMO_MODE
        value: "true"
      - key: DEFAULT_MODEL
        value: "qwen2.5:3b"
      - key: EMBEDDING_MODEL
        value: "nomic-embed-text"
